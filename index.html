<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster RNG Gacha</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a2e;
            color: #e6e6e6;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #f8bb22;
            margin-bottom: 30px;
        }
        .gacha-button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s;
            font-weight: bold;
        }
        .gacha-button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        .result {
            margin: 30px 0;
            padding: 20px;
            background-color: #0f3460;
            border-radius: 10px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-item {
            font-size: 24px;
            font-weight: bold;
            color: #f8bb22;
            margin: 10px 0;
        }
        .result-rarity {
            font-size: 16px;
            color: #e94560;
            margin-top: 5px;
        }
        .luck-meter {
            margin: 20px 0;
            background-color: #0f3460;
            padding: 15px;
            border-radius: 10px;
        }
        .luck-bar {
            height: 20px;
            background-color: #1a1a2e;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        .luck-progress {
            height: 100%;
            background: linear-gradient(90deg, #4e54c8, #8f94fb);
            width: 0%;
            transition: width 0.5s;
        }
        .luck-level {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .luck-button {
            background-color: #4e54c8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        .luck-button:hover {
            background-color: #8f94fb;
        }
        .inventory {
            margin-top: 30px;
            background-color: #0f3460;
            padding: 15px;
            border-radius: 10px;
        }
        .inventory h3 {
            margin-top: 0;
            color: #f8bb22;
        }
        .inventory-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .inventory-item {
            background-color: #1a1a2e;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .rarity-normal {
            color: #a0a0a0;
        }
        .rarity-uncommon {
            color: #4CAF50;
        }
        .rarity-rare {
            color: #2196F3;
        }
        .rarity-epic {
            color: #9C27B0;
        }
        .rarity-legendary {
            color: #FF9800;
        }
        .rarity-mythic {
            color: #f44336;
        }
        .rarity-cosmic {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
        .rarity-secret {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            from {
                text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
            }
            to {
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            }
        }
        .cosmic-effect {
            background: radial-gradient(circle, rgba(255,0,255,0.2) 0%, rgba(0,0,0,0) 70%);
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .secret-effect {
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, rgba(0,0,0,0) 70%);
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MONSTER RNG GACHA</h1>
        
        <div class="luck-meter">
            <div class="luck-level">Luck Level: <span id="luck-level">1</span></div>
            <div class="luck-bar">
                <div class="luck-progress" id="luck-progress"></div>
            </div>
            <p>Luck increases your chances for better items!</p>
            <button class="luck-button" id="increase-luck">Increase Luck (+1)</button>
            <button class="luck-button" id="reset-luck">Reset Luck</button>
            <p>Current Luck Multiplier: <span id="luck-multiplier">1x</span></p>
        </div>
        
        <button class="gacha-button" id="gacha-button">ROLL GACHA (1,268m Max Chance)</button>
        
        <div class="result" id="result">
            <p>Roll the gacha to see what you get!</p>
        </div>
        
        <div class="inventory">
            <h3>Your Inventory</h3>
            <div class="inventory-items" id="inventory">
                <p>Your items will appear here</p>
            </div>
        </div>
    </div>

    <script>
        // Gacha items with their base chances
        const items = [
            { name: "Normal", chance: 500000, rarity: "normal" },
            { name: "Strong", chance: 250000, rarity: "uncommon" },
            { name: "Sharps", chance: 250000, rarity: "uncommon" },
            { name: "Balls", chance: 100000, rarity: "rare" },
            { name: "Stick", chance: 50000, rarity: "rare" },
            { name: "Bow", chance: 25000, rarity: "epic" },
            { name: "Sword", chance: 20000, rarity: "epic" },
            { name: "Balls (Mutated)", chance: 15000, rarity: "epic" },
            { name: "Gun", chance: 20000, rarity: "epic" },
            { name: "Stick (Mutated)", chance: 8000, rarity: "legendary" },
            { name: "Fire", chance: 6500, rarity: "legendary" },
            { name: "Water", chance: 6500, rarity: "legendary" },
            { name: "Grass", chance: 6000, rarity: "legendary" },
            { name: "Crystal", chance: 1000, rarity: "mythic" },
            { name: "Sniper", chance: 10000, rarity: "legendary" },
            { name: "Shurikens", chance: 40000, rarity: "rare" },
            { name: "Pedang Catur", chance: 1000, rarity: "mythic" },
            { name: "tombak kemerdekan", chance: 8000, rarity: "legendary" },
            { name: "pentungan Fire", chance: 1500, rarity: "legendary"},
            { name: "Cosmic Blade", chance: 500, rarity: "cosmic" },
            { name: "Galactic Shield", chance: 500, rarity: "cosmic" },
            { name: "Secret Artifact", chance: 100, rarity: "secret" },
            { name: "Forbidden Scroll", chance: 100, rarity: "secret" }
        ];

        // Game state
        let luckLevel = 1;
        let luckPoints = 0;
        const maxLuckLevel = 10;
        const luckPointsNeeded = [0, 5, 15, 30, 50, 75, 105, 140, 180, 225, 275];
        let inventory = [];
        
        // DOM elements
        const gachaButton = document.getElementById('gacha-button');
        const resultDiv = document.getElementById('result');
        const increaseLuckBtn = document.getElementById('increase-luck');
        const resetLuckBtn = document.getElementById('reset-luck');
        const luckLevelSpan = document.getElementById('luck-level');
        const luckProgress = document.getElementById('luck-progress');
        const luckMultiplierSpan = document.getElementById('luck-multiplier');
        const inventoryDiv = document.getElementById('inventory');
        
        // Initialize
        updateLuckUI();
        
        // Event listeners
        gachaButton.addEventListener('click', rollGacha);
        increaseLuckBtn.addEventListener('click', increaseLuck);
        resetLuckBtn.addEventListener('click', resetLuck);
        
        // Gacha function
        function rollGacha() {
            // Calculate total chance with luck modifier
            const luckMultiplier = 1 + (luckLevel * 0.1);
            let totalChance = 0;
            
            // Create weighted items array with luck applied to rare items
            const weightedItems = items.map(item => {
                let weightedChance = item.chance;
                
                // Apply luck multiplier to items that aren't "Normal"
                if (item.name !== "Normal") {
                    weightedChance *= luckMultiplier;
                }
                
                // Extra boost for cosmic and secret items at higher luck levels
                if (item.rarity === "cosmic" || item.rarity === "secret") {
                    weightedChance *= (1 + (luckLevel * 0.05));
                }
                
                totalChance += weightedChance;
                return {
                    name: item.name,
                    chance: weightedChance,
                    rarity: item.rarity
                };
            });
            
            // Generate a random number within the total chance
            const random = Math.random() * totalChance;
            
            // Find which item corresponds to the random number
            let cumulativeChance = 0;
            let selectedItem = null;
            
            for (const item of weightedItems) {
                cumulativeChance += item.chance;
                if (random <= cumulativeChance) {
                    selectedItem = item;
                    break;
                }
            }
            
            // Add to inventory
            inventory.push(selectedItem);
            
            // Display result with special effects for cosmic/secret
            displayResult(selectedItem);
            
            // Update inventory display
            updateInventory();
            
            // Add luck points based on item rarity
            switch(selectedItem.rarity) {
                case "normal":
                    luckPoints += 1;
                    break;
                case "uncommon":
                    luckPoints += 2;
                    break;
                case "rare":
                    luckPoints += 3;
                    break;
                case "epic":
                    luckPoints += 5;
                    break;
                case "legendary":
                    luckPoints += 8;
                    break;
                case "mythic":
                    luckPoints += 15;
                    break;
                case "cosmic":
                    luckPoints += 25;
                    break;
                case "secret":
                    luckPoints += 50;
                    break;
            }
            
            // Check if luck level can be increased
            if (luckLevel < maxLuckLevel && luckPoints >= luckPointsNeeded[luckLevel + 1]) {
                luckLevel++;
                updateLuckUI();
                alert(`Luck Level Increased to ${luckLevel}!`);
            } else {
                updateLuckUI();
            }
        }
        
        // Display the gacha result
        function displayResult(item) {
            let rarityClass = "";
            let rarityName = "";
            let effectClass = "";
            
            switch(item.rarity) {
                case "normal":
                    rarityClass = "rarity-normal";
                    rarityName = "Normal";
                    break;
                case "uncommon":
                    rarityClass = "rarity-uncommon";
                    rarityName = "Uncommon";
                    break;
                case "rare":
                    rarityClass = "rarity-rare";
                    rarityName = "Rare";
                    break;
                case "epic":
                    rarityClass = "rarity-epic";
                    rarityName = "Epic";
                    break;
                case "legendary":
                    rarityClass = "rarity-legendary";
                    rarityName = "Legendary";
                    break;
                case "mythic":
                    rarityClass = "rarity-mythic";
                    rarityName = "Mythic";
                    break;
                case "cosmic":
                    rarityClass = "rarity-cosmic";
                    rarityName = "Cosmic";
                    effectClass = "cosmic-effect";
                    break;
                case "secret":
                    rarityClass = "rarity-secret";
                    rarityName = "Secret";
                    effectClass = "secret-effect";
                    break;
            }
            
            let resultHTML = `
                <div class="${effectClass}">
                    <div class="result-item ${rarityClass}">${item.name}</div>
                    <div class="result-rarity">${rarityName}</div>
                </div>
            `;
            
            // Special celebration for cosmic/secret items
            if (item.rarity === "cosmic" || item.rarity === "secret") {
                resultHTML += `<p>✨ AMAZING PULL! ✨</p>`;
                
                // Play a sound if available (you would need to add sound files)
                try {
                    const audio = new Audio(item.rarity === "cosmic" ? 'cosmic_sound.mp3' : 'secret_sound.mp3');
                    audio.volume = 0.5;
                    audio.play().catch(e => console.log("Audio play failed:", e));
                } catch (e) {
                    console.log("Audio error:", e);
                }
            }
            
            resultDiv.innerHTML = resultHTML;
        }
        
        // Increase luck level
        function increaseLuck() {
            if (luckLevel < maxLuckLevel && luckPoints >= luckPointsNeeded[luckLevel + 1]) {
                luckLevel++;
                updateLuckUI();
                alert(`Luck Level Increased to ${luckLevel}!`);
            } else {
                alert(`You need ${luckPointsNeeded[luckLevel + 1] - luckPoints} more luck points to reach level ${luckLevel + 1}`);
            }
        }
        
        // Reset luck level
        function resetLuck() {
            if (confirm("Are you sure you want to reset your luck level? You'll lose all progress.")) {
                luckLevel = 1;
                luckPoints = 0;
                updateLuckUI();
            }
        }
        
        // Update luck UI
        function updateLuckUI() {
            luckLevelSpan.textContent = luckLevel;
            
            if (luckLevel < maxLuckLevel) {
                const currentPoints = luckPoints - luckPointsNeeded[luckLevel];
                const neededPoints = luckPointsNeeded[luckLevel + 1] - luckPointsNeeded[luckLevel];
                const progressPercent = (currentPoints / neededPoints) * 100;
                luckProgress.style.width = `${progressPercent}%`;
            } else {
                luckProgress.style.width = "100%";
            }
            
            const luckMultiplier = 1 + (luckLevel * 0.1);
            luckMultiplierSpan.textContent = `${luckMultiplier.toFixed(1)}x`;
        }
        
        // Update inventory display
        function updateInventory() {
            if (inventory.length === 0) {
                inventoryDiv.innerHTML = "<p>Your items will appear here</p>";
                return;
            }
            
            // Count items by type
            const itemCounts = {};
            inventory.forEach(item => {
                const key = `${item.name}|${item.rarity}`;
                itemCounts[key] = (itemCounts[key] || 0) + 1;
            });
            
            // Create inventory display
            let inventoryHTML = "";
            for (const key in itemCounts) {
                const [name, rarity] = key.split("|");
                const count = itemCounts[key];
                let rarityClass = "";
                
                switch(rarity) {
                    case "normal":
                        rarityClass = "rarity-normal";
                        break;
                    case "uncommon":
                        rarityClass = "rarity-uncommon";
                        break;
                    case "rare":
                        rarityClass = "rarity-rare";
                        break;
                    case "epic":
                        rarityClass = "rarity-epic";
                        break;
                    case "legendary":
                        rarityClass = "rarity-legendary";
                        break;
                    case "mythic":
                        rarityClass = "rarity-mythic";
                        break;
                    case "cosmic":
                        rarityClass = "rarity-cosmic";
                        break;
                    case "secret":
                        rarityClass = "rarity-secret";
                        break;
                }
                
                inventoryHTML += `<div class="inventory-item ${rarityClass}">${name} ×${count}</div>`;
            }
            
            inventoryDiv.innerHTML = inventoryHTML;
        }
    </script>
</body>
</html>
