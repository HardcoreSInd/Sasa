<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan PKL </title>
    <style>
        /* Reset dan pengaturan dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
            font-size: 12pt;
        }
        
        /* Container utama */
        .container {
            width: 21cm;
            min-height: 29.7cm;
            margin: 0 auto;
            padding: 2.5cm 2.5cm 2.5cm 3cm; /* Margin kiri lebih besar untuk binding */
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Halaman sampul */
        .cover-page {
            text-align: center;
            padding-top: 8cm;
        }
        
        .cover-page h1 {
            font-size: 16pt;
            text-transform: uppercase;
            margin-bottom: 1.5cm;
        }
        
        .cover-page h2 {
            font-size: 14pt;
            margin-bottom: 2cm;
        }
        
        .cover-page .logo {
            margin-bottom: 1.5cm;
        }
        
        .cover-page .student-info {
            margin-bottom: 2cm;
        }
        
        .cover-page .institution-info {
            margin-top: 3cm;
        }
        
        /* Halaman pengesahan */
        .approval-page {
            padding-top: 5cm;
        }
        
        .approval-page h2 {
            text-align: center;
            margin-bottom: 1.5cm;
            text-decoration: underline;
        }
        
        .approval-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2cm;
        }
        
        .approval-table td {
            padding: 8px;
            vertical-align: top;
        }
        
        .signature-area {
            margin-top: 2cm;
            text-align: center;
        }
        
        .signature-box {
            display: inline-block;
            width: 6cm;
            margin: 0 1cm;
        }
        
        /* Halaman daftar isi */
        .toc-page h2 {
            text-align: center;
            margin-bottom: 1.5cm;
        }
        
        .toc-list {
            list-style-type: none;
        }
        
        .toc-list li {
            margin-bottom: 5px;
        }
        
        .toc-list .chapter {
            font-weight: bold;
        }
        
        .toc-list .page-number {
            float: right;
        }
        
        /* Bab dan sub-bab */
        .chapter {
            margin-top: 1.5cm;
            margin-bottom: 1cm;
        }
        
        .chapter h2 {
            text-align: center;
            margin-bottom: 1cm;
            text-transform: uppercase;
        }
        
        .section {
            margin-top: 1cm;
            margin-bottom: 0.5cm;
        }
        
        .section h3 {
            margin-bottom: 0.5cm;
        }
        
        .subsection {
            margin-top: 0.5cm;
            margin-bottom: 0.3cm;
        }
        
        .subsection h4 {
            margin-bottom: 0.3cm;
        }
        
        /* Paragraf dan teks */
        p {
            text-align: justify;
            margin-bottom: 0.5cm;
            text-indent: 1.27cm;
        }
        
        /* Tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5cm 0;
        }
        
        table, th, td {
            border: 1px solid #333;
        }
        
        th, td {
            padding: 8px;
            text-align: left;
        }
        
        th {
            background-color: #f2f2f2;
        }
        
        /* Gambar */
        .figure {
            text-align: center;
            margin: 0.5cm 0;
        }
        
        .figure img {
            max-width: 100%;
            height: auto;
        }
        
        .figure-caption {
            font-style: italic;
            margin-top: 5px;
        }
        
        /* Daftar pustaka */
        .references {
            margin-top: 1cm;
        }
        
        .references h2 {
            text-align: center;
            margin-bottom: 1cm;
        }
        
        .reference-item {
            margin-bottom: 0.5cm;
            text-indent: -1.27cm;
            padding-left: 1.27cm;
        }
        
        /* Halaman kosong untuk pencetakan */
        .page-break {
            page-break-after: always;
        }
        
        /* Header dan footer */
        @page {
            margin: 0;
        }
        
        .header, .footer {
            position: fixed;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10pt;
        }
        
        .header {
            top: 1cm;
        }
        
        .footer {
            bottom: 1cm;
        }
        
        /* Untuk nomor halaman */
        .page-number:after {
            content: counter(page);
        }
    </style>
</head>
<body>
    <div class="container">
     
</body>
</html>
